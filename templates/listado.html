{% extends 'base.html' %}
{% block title %} Listado Usuarios {% endblock %}
{% block body %}

  <center><br>
    <table class="table table-hover">
      <thead>
        <tr> 
          <th scope="col">ID</th>
          <th scope="col">Dni</th>
          <th scope="col">Nombre</th>
          <th scope="col">Apellido</th>
          <th scope="col">Teléfono</th>
          <th scope="col">E-mail</th>
          <th scope="col">Opciones</th>
        </tr>
      </thead>
      <tbody>
        {% for cte in clientes %}
        <tr class="table-active">
          <th scope="row">{{ cte.0 }}</th>
          <td>{{ cte.1 }}</td>
          <td>{{ cte.2 }}</td>
          <td>{{ cte.3 }}</td>
          <td>{{ cte.4 }}</td>
          <td>{{ cte.5 }}</td>
          <td><a class="btn btn-secondary my-2 my-sm-0" href="/obtenerCliente/{{cte.0}}"> Editar </a></td>
          <td><a class="btn btn-secondary my-2 my-sm-0" onclick="return mostrar()" href="/eliminar/{{cte.0}}">Eliminar</a></button></td>
        <script type="text/javascript" id='btn btn-secondary my-2 my-sm-0'>
        function mostrar(){
          var respuesta = confirm('¿Desea eliminar el usuario?')
          return respuesta;
          };
        </script>

        {% endfor %}
        </tr>
      </tbody>
    </table>
  
</center>
{% endblock %}
