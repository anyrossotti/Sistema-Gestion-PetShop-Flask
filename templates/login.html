{% extends 'base.html' %}
{% block title %} Login {% endblock %}
{% block body %}

<div class="row">
    <center>
    <div class="col-md-7 pt-2">
      <div class="card card-body">
        <form action="/login" method = "POST">
        <fieldset>
        <h2><legend>Login</legend><h2>
        <div class="form-group">
          <input type="email" name="email" class="form-control mt-2" id="exampleInputEmail1" minlength="5" maxlength="30" placeholder="E-mail" required >
        </div>
        <div class="form-group">
          <input type="password" name="password" class="form-control mt-2" id="exampleInputPassword1" placeholder="password" required >
        </div>
        <button type="submit" class="btn btn-primary mt-3">Login</button>
      </fieldset>
      </form>
      </div>    
    </div>    
  </div>

{% endblock %}
